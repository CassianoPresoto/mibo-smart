name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false

jobs:
  shared:
    name: shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Testes commonTest + androidHostTest
        run: >
          ./gradlew
          :shared:domain:testAndroidHostTest
          :shared:rest:testAndroidHostTest
          :shared:persistence:testAndroidHostTest
          :shared:business:testAndroidHostTest
          :shared:testAndroidHostTest
          --stacktrace

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-test-reports
          path: |
            shared/build/reports/tests/
            shared/*/build/reports/tests/
          if-no-files-found: ignore

  androidApp:
    name: androidApp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Testes unitarios
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :androidApp:lintDebug --stacktrace

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: androidApp-reports
          path: androidApp/build/reports/
          if-no-files-found: ignore

  iosApp:
    name: iosApp
    # Runner macOS custa 10x por minuto de cota, contra 1x dos jobs Linux, entao o alvo iOS
    # roda so no portao de entrada da main. Consequencia a assumir: PR para develop nao verifica
    # iOS: alvos Apple so compilam em macOS, e o job shared cobre apenas Android/JVM.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Testes unitarios iOS
        run: >
          ./gradlew
          :shared:domain:iosSimulatorArm64Test
          :shared:rest:iosSimulatorArm64Test
          :shared:persistence:iosSimulatorArm64Test
          :shared:business:iosSimulatorArm64Test
          :shared:iosSimulatorArm64Test
          --stacktrace

      - name: Build do framework Kotlin
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build do app iOS
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iosApp-test-reports
          path: |
            shared/build/reports/tests/
            shared/*/build/reports/tests/
          if-no-files-found: ignore
